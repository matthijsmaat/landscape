<style>
:root{--bg:#f5f6f8;--pn:#fff;--tx:#1d2330;--mu:#6b7280;--bd:#d5d9e0;--ac:#2563eb;--fd:#aab0ba;--inp:#fff;--inpb:#8b94a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--pn:#1e232b;--tx:#e6e8ec;--mu:#98a0ad;--bd:#343b46;--ac:#6b9bff;--fd:#5b6470;--inp:#0e1116;--inpb:#6b7482}}
:root[data-theme="dark"]{--bg:#14171c;--pn:#1e232b;--tx:#e6e8ec;--mu:#98a0ad;--bd:#343b46;--ac:#6b9bff;--fd:#5b6470;--inp:#0e1116;--inpb:#6b7482}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:14px ArchSans,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:5px;padding:4px 8px}
